pack:
  name: agent-context-fabric-mcp-valid
  version: "1.0.0"
  enabled: true
policies:
  chain:
    - prompt-injection
context_fabric:
  capture_mode: nudge
mcp_server:
  enabled: true
  path: /mcp
  auth_mode: bearer
  default_capture_mode: nudge
  allowed_tools:
    - gateway_default_tool
  allowed_resources: "*"
agents:
  - id: code-assistant
    team: backend-eng
    context_fabric:
      enabled: true
      capture_mode: off
      pool_max_entries: 500
      direct_answer_threshold: 0.9
    mcp:
      enabled: true
      allowed_tools:
        - context_search
      session_limits:
        max_prompt_bytes: 64000
      tool_servers:
        allow_unapproved: false
        allowed_ids:
          - approved-db-tool
  - id: research-agent
    team: data-science
    context_fabric:
      enabled: true
      capture_mode: auto
    mcp:
      enabled: true
      allowed_tools: "*"
      allowed_resources: "*"
