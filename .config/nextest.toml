[profile.default]
retries = 0
fail-fast = true
global-timeout = "2h"
slow-timeout = { period = "30s", terminate-after = 2 }
leak-timeout = "1s"
status-level = "slow"
final-status-level = "slow"

[profile.fast]
retries = 0
fail-fast = true
global-timeout = "30m"
slow-timeout = { period = "10s", terminate-after = 1 }
leak-timeout = "50ms"
status-level = "slow"
final-status-level = "slow"
test-threads = "num-cpus"

[profile.ci]
retries = 0
failure-output = "immediate-final"
fail-fast = false
global-timeout = "4h"
slow-timeout = { period = "120s", terminate-after = 3 }
status-level = "slow"
final-status-level = "slow"

[profile.ci.junit]
path = "target/nextest/ci/cli-junit.xml"

[profile.ci-default]
inherits = "ci"

[profile.ci-default.junit]
path = "target/nextest/ci/default.xml"

[profile.ci-distributed]
inherits = "ci"

[profile.ci-distributed.junit]
path = "target/nextest/ci/distributed.xml"

[profile.ci-otlp]
inherits = "ci"

[profile.ci-otlp.junit]
path = "target/nextest/ci/otlp.xml"

[profile.ci-embedding-external]
inherits = "ci"

[profile.ci-embedding-external.junit]
path = "target/nextest/ci/embedding-external.xml"

[profile.ci-all-features]
inherits = "ci"

[profile.ci-all-features.junit]
path = "target/nextest/ci/all-features.xml"
