[package]
name = "verdictan"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
description = "Verdictan AI governance gateway"
readme = "README.md"
repository = "https://github.com/verdictan/verdictan"
homepage = "https://verdictan.com"
authors = ["Verdictan <engineering@verdictan.com>"]
documentation = "https://docs.verdictan.com"
keywords = ["gateway", "llm", "ai", "governance", "policy"]
categories = ["command-line-utilities", "web-programming::http-server"]

default-run = "verdictan"

[features]
default = ["distributed", "otlp", "embedding-external"]
embedding-external = []
distributed = ["dep:redis", "dep:aws-sdk-s3", "dep:aws-types"]
otlp = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]

[[bin]]
name = "verdictan"
path = "src/main.rs"

[[bin]]
name = "verdictan-update"
path = "src/bin/verdictan-update.rs"

[dependencies]
axoupdater = { version = "0.10", default-features = true, features = ["blocking"] }
anyhow = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_yaml = "0.9"
semver = "1"
thiserror = "2.0.20"
axum = { version = "0.7", features = ["macros", "json", "multipart", "ws"] }
bytes = "1"
http = "1"
tokio = { version = "1", features = ["fs", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.5", features = ["trace", "cors"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-opentelemetry = { version = "0.33", optional = true }
opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "http-proto", "reqwest-client", "trace"], optional = true }

clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
jsonschema = "0.18"
hex = "0.4"
sha2 = "0.10"
aes-gcm = "0.10"
urlencoding = "2"
regex-lite = "0.1"
chrono = { version = "0.4", features = ["clock", "serde"] }
crc32fast = "1"
bigdecimal = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
base64 = "0.22"
ed25519-dalek = "3.0.0"
hmac = "0.12"
# Audited RFC-9180 HPKE (DHKEM(X25519,HKDF-SHA256) / HKDF-SHA256 / ChaCha20Poly1305)
# used by the CLI sealed Trail-intent outbox. Version-pinned to match the API
# control-plane implementation (api/Cargo.toml) so the sender and recipient
# halves interoperate byte-for-byte.
hpke = "0.14"
ipnet = "2"
strsim = "0.11"
redis = { version = "0.25", optional = true, features = ["tokio-comp", "connection-manager"] }
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
aws-credential-types = { version = "1" }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"], optional = true }
aws-types = { version = "1", optional = true }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
flate2 = "1"
async-stream = "0.3"
futures-util = "0.3"
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
indexmap = { version = "2", features = ["serde"] }
prometheus = { version = "0.13", default-features = false }
dashmap = "6"
bincode = "=1.3.3"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"
axum = { version = "0.7", features = ["macros", "json", "multipart", "ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
rustls = { version = "0.23", features = ["ring"] }
rsa = { version = "0.9", features = ["pem"] }
rand = "0.10.2"
serial_test = "4"

# ---------------------------------------------------------------------------
# Test profile — maximize compile parallelism and skip debug info.
# The host runner also sets CARGO_PROFILE_TEST_DEBUG=0.
# ---------------------------------------------------------------------------
[profile.test]
opt-level = 0
debug = 0
codegen-units = 256
incremental = true
strip = "debuginfo"

# Compile third-party crates with light optimization; level 1 balances
# test-time speed against initial compile cost better than level 2.
[profile.test.package."*"]
opt-level = 1
codegen-units = 16

# Dev profile inherits the same debug-off defaults used in test.
[profile.dev]
debug = 0
split-debuginfo = "off"
incremental = true

[profile.dev.package."*"]
opt-level = 1
codegen-units = 16

# ---------------------------------------------------------------------------
# Release profile — strip symbols, enable LTO, single codegen unit for a
# smaller, faster binary.
# ---------------------------------------------------------------------------
[profile.release]
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"

# ---------------------------------------------------------------------------
# cargo-deb metadata — used by `cargo deb` to produce a .deb package.
# ---------------------------------------------------------------------------
[package.metadata.deb]
maintainer = "Verdictan <engineering@verdictan.com>"
license-file = ["LICENSE", "4"]
section = "utils"
priority = "optional"
depends = ""
assets = [
    ["target/release/verdictan", "/usr/local/bin/verdictan", "755"],
    ["THIRD_PARTY_NOTICES.md", "usr/share/doc/verdictan/THIRD_PARTY_NOTICES.md", "644"],
    ["LICENSE", "usr/share/doc/verdictan/copyright", "644"],
]
extended-description = "Verdictan AI governance gateway — policy enforcement, audit, and control for LLM traffic."

# ---------------------------------------------------------------------------
# cargo-generate-rpm metadata — used by `cargo generate-rpm` to produce an
# .rpm package.
# ---------------------------------------------------------------------------
[package.metadata.generate-rpm]
name = "verdictan-gateway"
license = "BUSL-1.1"
summary = "Verdictan AI governance gateway"
description = "Verdictan AI governance gateway — policy enforcement, audit, and control for LLM traffic."

[[package.metadata.generate-rpm.assets]]
source = "target/release/verdictan"
dest = "/usr/local/bin/verdictan"
mode = "0755"

[[package.metadata.generate-rpm.assets]]
source = "THIRD_PARTY_NOTICES.md"
dest = "/usr/share/doc/verdictan-gateway/THIRD_PARTY_NOTICES.md"
mode = "0644"

[[package.metadata.generate-rpm.assets]]
source = "LICENSE"
dest = "/usr/share/doc/verdictan-gateway/LICENSE"
mode = "0644"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "warn"
todo = "warn"
dbg_macro = "deny"

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verdictan_cli_e2e)'] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

# Raw Win32 bindings for the trusted-execution security checks in
# src/gateway/windows_trusted_execution.rs: security-descriptor and ACL reads
# (GetSecurityInfo, GetAce, SID accessors) and FILE_ID_INFO identity
# (GetFileInformationByHandleEx). Gated to Windows targets so no Unix build
# resolves it. The version matches the transitive windows-sys already in
# Cargo.lock, so no new package version enters the graph.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }
[profile.dist]
inherits = "release"
lto = "thin"
